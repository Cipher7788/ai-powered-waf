services:
  waf:
    build: .
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    environment:
      FLASK_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env or environment}
      WAF_ADMIN_TOKEN: ${WAF_ADMIN_TOKEN:?Set WAF_ADMIN_TOKEN in .env or environment}
      PORT: 5000
      LOG_FILE: /app/logs/security.log
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - waf_logs:/app/logs
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  waf_logs:
